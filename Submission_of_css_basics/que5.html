<!DOCTYPE html>
<html>
<head>
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="que5.css">
</head>
<body>

    <h1>Pricing Plans</h1>

    <!-- Three Equal Columns -->
    <div class="plans">

        <!-- Basic Plan -->
        <div class="plan">
            <h2>Basic</h2>
            <p>$10 / month</p>
            <ul>
                <li>5 Projects</li>
                <li>10 GB Storage</li>
            </ul>
            <a href="#">Choose Plan</a>
        </div>

        <!-- Most Popular Plan -->
        <div class="plan popular">
            <h2>Standard</h2>
            <p>$20 / month</p>
            <ul>
                <li>10 Projects</li>
                <li>50 GB Storage</li>
                <li>Email Support</li>
            </ul>
            <a href="#">Choose Plan</a>
        </div>

        <!-- Premium Plan -->
        <div class="plan">
            <h2>Premium</h2>
            <p>$30 / month</p>
            <ul>
                <li>Unlimited Projects</li>
                <li>100 GB Storage</li>
            </ul>
            <a href="#">Choose Plan</a>
        </div>

    </div>

</body>
</html>
