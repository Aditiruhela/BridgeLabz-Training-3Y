<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="que3.css">
</head>
<body>

<div class="container my-5">
    <div class="row g-4">

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card">
                <img src="product1.jpg" class="card-img-top" alt="Product">
                <div class="card-body">
                    <h5>Product 1</h5>
                    <p>₹999</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card">
                <img src="product2.jpg" class="card-img-top" alt="Product">
                <div class="card-body">
                    <h5>Product 2</h5>
                    <p>₹799</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card">
                <img src="product3.jpg" class="card-img-top" alt="Product">
                <div class="card-body">
                    <h5>Product 3</h5>
                    <p>₹599</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card">
                <img src="product4.jpg" class="card-img-top" alt="Product">
                <div class="card-body">
                    <h5>Product 4</h5>
                    <p>₹899</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
