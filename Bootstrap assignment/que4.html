<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="que4.css">
</head>
<body>

<div class="container my-5">

    <h1 class="text-center">Today's Menu</h1>
    <p class="lead text-center">Fresh and delicious food</p>

    <table class="table table-bordered">
        <tr>
            <th>Item</th>
            <th>Category</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Paneer Tikka</td>
            <td>Starter</td>
            <td>₹250</td>
        </tr>
        <tr>
            <td>Butter Paneer</td>
            <td>Main Course</td>
            <td>₹300</td>
        </tr>
        <tr>
            <td>Gulab Jamun</td>
            <td>Dessert</td>
            <td>₹120</td>
        </tr>
    </table>

    <h3>Chef's Specials</h3>
    <ul class="list-group">
        <li class="list-group-item">Special Biryani</li>
        <li class="list-group-item">Tandoori Platter</li>
        <li class="list-group-item">Chocolate Brownie</li>
    </ul>

    <div class="text-center mt-4">
        <img src="food.jpg" class="img-fluid" alt="Food">
        <p>Delicious Chef Special</p>
    </div>

</div>

</body>
</html>
