<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration Form</title>
<style>
  body {
    font-family: "Times New Roman", Times, serif;
    display: flex;
    justify-content: center;
    padding: 20px;
    background: #fff;
  }
  .container {
    width: 700px;
    border: 3px solid #000;
    padding: 15px;
  }
  h1 {
    text-align: center;
    font-size: 26px;
    margin: 5px 0 15px 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  caption {
    border: 1px solid #000;
    background: #fff;
    font-weight: bold;
    padding: 8px;
  }
  td, th {
    border: 1px solid #000;
    padding: 10px;
    vertical-align: middle;
  }
  .label-col {
    width: 35%;
    font-weight: normal;
  }
  input[type="text"],
  input[type="email"],
  input[type="tel"],
  input[type="date"],
  textarea,
  select {
    width: 100%;
    padding: 6px;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 14px;
    border: 1px solid #999;
  }
  textarea {
    resize: vertical;
    height: 60px;
  }
  .radio-group label,
  .checkbox-group label {
    margin-right: 15px;
    font-weight: normal;
  }
  .btn-row {
    text-align: center;
  }
  button {
    padding: 6px 18px;
    margin: 0 5px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Student Registration Form</h1>
  <form>
    <table>
      <caption>Registration Form</caption>
      <tr>
        <td class="label-col">Full Name</td>
        <td><input type="text" placeholder="Enter your name" required></td>
      </tr>
      <tr>
        <td class="label-col">Email</td>
        <td><input type="email" placeholder="abc@gmail.com" required></td>
      </tr>
      <tr>
        <td class="label-col">Phone Number</td>
        <td><input type="tel" placeholder="9876543210" pattern="[0-9]{10}"></td>
      </tr>
      <tr>
        <td class="label-col">Date of Birth</td>
        <td><input type="date"></td>
      </tr>
      <tr>
        <td class="label-col">Gender</td>
        <td class="radio-group">
          <label><input type="radio" name="gender" value="Male"> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </td>
      </tr>
      <tr>
        <td class="label-col">Skills</td>
        <td class="checkbox-group">
          <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
          <label><input type="checkbox" name="skills" value="CSS"> CSS</label>
          <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
        </td>
      </tr>
      <tr>
        <td class="label-col">Course</td>
        <td>
          <select required>
            <option value="" selected disabled>--Select Course--</option>
            <option value="BCA">BCA</option>
            <option value="BTech">B.Tech</option>
            <option value="MCA">MCA</option>
            <option value="Other">Other</option>
          </select>
        </td>
      </tr>
      <tr>
        <td class="label-col">Address</td>
        <td><textarea></textarea></td>
      </tr>
      <tr>
        <td class="label-col">Upload Resume</td>
        <td><input type="file"></td>
      </tr>
      <tr>
        <td colspan="2" class="btn-row">
          <button type="submit">Register</button>
          <button type="reset">Reset</button>
        </td>
      </tr>
    </table>
  </form>
</div>

</body>
</html>
