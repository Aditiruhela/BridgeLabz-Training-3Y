<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product_card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="image-box">
            <span class="badge">20% OFF</span>
            <button class="heart">
                <i class="fa-regular fa-heart">
                </i></button>
            <img src="shoe.jpg" alt="shoe">
        </div>
        <div class="info">
            <p class="tag">SPORTS SHOES</p>
            <h3 class="title">PREMIUM RUNNING SHOES</h3>
            <p class="rating">
                <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i>
                <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i>
                <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i>
                <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i>
                <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i>
                (120)
            </p>
            <p class="price"> &#8377;1,999
            <span class="old-price">&#8377;2,499</span> </p>
            <button>Add to Cart</button>
        </div>
    </div>
</body>
</html>
