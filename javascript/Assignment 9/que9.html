<!DOCTYPE html>
<html>
<head>
    <title>Multi jQuery</title>

    <!-- jQuery Version 1 -->
    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>

    <script>
        var jq1 = jQuery.noConflict(true);
    </script>

    <!-- jQuery Version 2 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        var jq2 = jQuery.noConflict(true);
    </script>
</head>

<body>

<header><h1>Dashboard</h1></header>

<main>
    <div id="carousel">
        <div class="slide">Slide 1</div>
        <div class="slide">Slide 2</div>
        <div class="slide">Slide 3</div>
        <div class="slide">Slide 4</div>
        <div class="slide">Slide 5</div>
    </div>

    <button id="notification">Show Notification</button>

    <div class="widget" title="Widget One">Widget 1</div>
    <div class="widget" title="Widget Two">Widget 2</div>
    <div class="widget" title="Widget Three">Widget 3</div>
    <div class="widget" title="Widget Four">Widget 4</div>
    <div class="widget" title="Widget Five">Widget 5</div>

    <div id="modal" style="display:none;">
        <h2>New Notification!</h2>
        <button id="close">Close</button>
    </div>
</main>

<script src="q9.js"></script>
</body>
</html>
