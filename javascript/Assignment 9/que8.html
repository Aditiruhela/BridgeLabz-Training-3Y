<!DOCTYPE html>
<html>
<head>
    <title>Blog Posts</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<header><h1>Blog Admin</h1></header>

<main>
    <button id="add">Add New Post</button>
    <button id="featured">Prepend Featured Post</button>
    <button id="remove">Remove Last Post</button>
    <button id="tags">Add Tags</button>
    <button id="highlight">Highlight JavaScript</button>

    <section id="posts">
        <article class="post">Learning JavaScript</article>
        <article class="post">Learning Python</article>
        <article class="post">Web Development</article>
        <article class="post">Artificial Intelligence</article>
        <article class="post">Database Management</article>
    </section>
</main>

<script src="q8.js"></script>
</body>
</html>
