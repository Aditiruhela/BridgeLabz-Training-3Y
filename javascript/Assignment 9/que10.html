<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<header><h1>Registration Form</h1></header>

<main>
    <form id="registration">

        <input id="name" type="text" placeholder="Name"><br><br>

        <input id="email" type="text" placeholder="Email"><br><br>

        <input id="password" type="password" placeholder="Password"><br><br>

        <input id="confirmPassword" type="password"
               placeholder="Confirm Password"><br><br>

        <input id="phone" type="text" placeholder="Phone"><br><br>

        <button type="submit">Register</button>

    </form>

    <p id="message"></p>
</main>

<script src="q10.js"></script>
</body>
</html>
