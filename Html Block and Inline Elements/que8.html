<!DOCTYPE html>
<html lang="en">
<head>

    <title>Student Report</title>

            <td>90</td>

            <td>Pass</td>

        <tr>
            <td title="Subject1">English</td>
            <td>100</td>
            <td>90</td>
            <td>A+</td>

        </tr>
        <tr>
            <td title="Subject1">Hindi</td>
            <td>100</td>
            <td>90</td>
            <td>A+</td>
            <td>Pass</td>
        </tr>
        <tr>
            <td title="Subject1">Compute</td>
            <td>100</td>
            <td>90</td>
            <td>A+</td>
            <td>Pass</td>
        </tr>

        <tr>
            <th colspan="2">Total</th>
            <td colspan="3">411/500</td>
        </tr>
        <tr>
            <th colspan="2">Precentage</th>
            <td colspan="3">99.96%</td>
        </tr>
    </table>

</body>
</html>
