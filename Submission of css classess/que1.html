<!DOCTYPE html>
<html>
<head>
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="que1.css">
</head>
<body>

    <h1>CSS Pseudo-Classes</h1>

    <div class="examples">

        <div>
            <h3>:hover</h3>
            <p>Changes style when mouse is over the element.</p>
            <a href="#">Hover Me</a>
        </div>

        <div>
            <h3>:focus</h3>
            <p>Changes style when an element gets focus.</p>
            <input type="text" placeholder="Click here">
        </div>

        <div>
            <h3>:active</h3>
            <p>Changes style while the element is being clicked.</p>
            <button>Click Me</button>
        </div>

        <div>
            <h3>:nth-child()</h3>
            <p>Styles an element according to its position.</p>
            <ul>
                <li>Item 1</li>
                <li>Item 2</li>
                <li>Item 3</li>
            </ul>
        </div>

    </div>

</body>
</html>
